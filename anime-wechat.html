<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>仿微信 · 二次元聊天页</title>
  <style>
    :root {
      --bg:#0f1220;
      --panel:#161a2d;
      --line:#2a3158;
      --text:#f3f5ff;
      --sub:#a7b0d9;
      --brand:#7cf2bc;
      --bubble-me:#8e7dff;
      --bubble-other:#23294a;
      --accent:#ff82bf;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
      background: radial-gradient(1200px 800px at 20% -10%,#2a3269 0%,var(--bg) 50%,#090b14 100%);
      color:var(--text);
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
    }
    .phone{
      width:min(420px,100%);
      height:min(860px,calc(100vh - 48px));
      border-radius:32px;
      background:linear-gradient(180deg,#1a2142 0%,#121631 100%);
      border:1px solid #3a4483;
      box-shadow:0 20px 60px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.06);
      display:flex;
      flex-direction:column;
      overflow:hidden;
      position:relative;
    }
    .status,.topbar,.inputbar{padding:12px 16px;border-bottom:1px solid var(--line)}
    .status{display:flex;justify-content:space-between;color:#cfd6ff;font-size:13px}
    .topbar{
      display:flex;align-items:center;gap:12px;
      background:rgba(0,0,0,.16);
    }
    .avatar{
      width:38px;height:38px;border-radius:12px;
      background:linear-gradient(135deg,#ff90c8,#7f93ff);
      display:grid;place-items:center;font-size:18px;
    }
    .title{font-weight:700}
    .subtitle{font-size:12px;color:var(--sub)}
    .chat{
      flex:1;
      overflow:auto;
      padding:14px;
      display:flex;
      flex-direction:column;
      gap:10px;
      background:
        radial-gradient(500px 180px at 70% 0%,rgba(255,130,191,.1),transparent 70%),
        radial-gradient(600px 200px at 20% 100%,rgba(124,242,188,.08),transparent 70%);
    }
    .msg{display:flex;align-items:flex-end;gap:8px}
    .msg.me{justify-content:flex-end}
    .bubble{
      max-width:76%;
      padding:10px 12px;
      border-radius:14px;
      line-height:1.45;
      font-size:14px;
      border:1px solid rgba(255,255,255,.06);
    }
    .other .bubble{background:var(--bubble-other)}
    .me .bubble{background:linear-gradient(135deg,var(--bubble-me),#7462ff)}
    .time{font-size:11px;color:var(--sub);margin:2px 4px}
    .inputbar{
      border-top:1px solid var(--line);
      border-bottom:0;
      display:flex;
      gap:10px;
      align-items:center;
      background:#11162f;
    }
    input{
      flex:1;
      padding:11px 12px;
      border-radius:12px;
      border:1px solid #3b4375;
      background:#1b2142;
      color:var(--text);
      outline:none;
    }
    button{
      border:0;
      background:linear-gradient(135deg,var(--brand),#5ad0ff);
      color:#0d1630;
      font-weight:700;
      padding:10px 14px;
      border-radius:12px;
      cursor:pointer;
    }
    .badge{
      position:absolute;top:82px;right:16px;
      background:var(--accent);color:white;
      font-size:11px;padding:4px 8px;border-radius:999px;
      box-shadow:0 6px 16px rgba(255,130,191,.4);
    }
  </style>
</head>
<body>
  <main class="phone" aria-label="仿微信二次元聊天界面">
    <div class="status"><span>12:30</span><span>5G · 87%</span></div>
    <header class="topbar">
      <div class="avatar">🌸</div>
      <div>
        <div class="title">星野同学</div>
        <div class="subtitle">在线 · 今天元气满满</div>
      </div>
    </header>

    <div class="badge">二次元主题</div>

    <section class="chat" id="chat">
      <div class="time">今天 12:28</div>
      <div class="msg other"><div class="avatar">✨</div><div class="bubble">早安！今天也要一起打卡学习吗？</div></div>
      <div class="msg me"><div class="bubble">当然！先写一个仿微信的二次元页面 ✍️</div></div>
      <div class="msg other"><div class="avatar">✨</div><div class="bubble">好耶～记得加点渐变和小装饰，氛围会更好看！</div></div>
    </section>

    <form class="inputbar" id="form">
      <input id="text" placeholder="发送一条弹幕感消息..." />
      <button type="submit">发送</button>
    </form>
  </main>

  <script>
    const form = document.getElementById('form');
    const text = document.getElementById('text');
    const chat = document.getElementById('chat');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const value = text.value.trim();
      if (!value) return;
      const row = document.createElement('div');
      row.className = 'msg me';
      row.innerHTML = `<div class="bubble"></div>`;
      row.querySelector('.bubble').textContent = value;
      chat.appendChild(row);
      chat.scrollTop = chat.scrollHeight;
      text.value = '';
    });
  </script>
</body>
</html>
